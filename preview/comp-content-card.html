<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Content Card</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { width: 700px; height: 250px; font-family: 'Pretendard','Noto Sans KR',sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .card {
    background: rgba(255,255,255,0.65); backdrop-filter: blur(14px);
    border-radius: 16px; padding: 22px 24px;
    border: 1px solid var(--glass-border); box-shadow: 0 4px 16px rgba(0,0,0,0.04);
  }
  .icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, #1a7a50, #2db88a);
    display: flex; align-items: center; justify-content: center; margin-bottom: 14px;
  }
  .icon svg { width: 18px; height: 18px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  h3 { font-size: 15px; font-weight: 700; color: var(--fg-1); margin: 0 0 8px; }
  p { font-size: 13px; color: rgba(15,40,48,0.6); line-height: 1.7; font-weight: 300; margin: 0; }
</style></head>
<body>
  <div class="atmosphere"></div>
  <div class="card-pad">
    <div class="grid">
      <div class="card">
        <div class="icon"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
        <h3>프로그램 목적</h3>
        <p>임원 레벨에서 AI를 단순 도구가 아닌 의사결정 파트너로 활용하는 역량을 내재화합니다.</p>
      </div>
      <div class="card">
        <div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg></div>
        <h3>핵심 철학</h3>
        <p>도구 습득보다 AI 사고력 함양에 집중합니다. 생각의 방식을 바꾸는 것이 먼저입니다.</p>
      </div>
    </div>
  </div>
</body></html>
