<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Display Type</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { width: 700px; height: 280px; }
  .specimen { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; }
  .row-spec { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px dashed rgba(15,40,48,0.10); }
  .row-spec:last-child { border-bottom: none; }
  .meta { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--fg-3); white-space: nowrap; }
  .display { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; color: var(--fg-1); line-height: 1.1; }
  .h1      { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; color: var(--fg-1); line-height: 1.15; }
  .h2      { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: var(--fg-1); line-height: 1.2; }
</style></head>
<body>
  <div class="atmosphere"></div>
  <div class="card-pad specimen">
    <div class="row-spec">
      <div class="display">AI 시대, 임원의 언어</div>
      <div class="meta">Display · 40 / 700 / -0.02em</div>
    </div>
    <div class="row-spec">
      <div class="h1">더 빠른 한솔을</div>
      <div class="meta">H1 · 36 / 700 / -0.02em</div>
    </div>
    <div class="row-spec">
      <div class="h2">교육 개요 및 방향성</div>
      <div class="meta">H2 · 28 / 700 / -0.02em</div>
    </div>
  </div>
</body></html>
