<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Index Item</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { width: 700px; height: 220px; font-family: 'Pretendard','Noto Sans KR',sans-serif; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .item {
    background: rgba(255,255,255,0.7); backdrop-filter: blur(16px);
    border-radius: 18px; padding: 22px 26px; border: 1px solid var(--glass-border);
    display: flex; align-items: flex-start; gap: 18px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.04);
  }
  .num { font-size: 30px; font-weight: 900; color: rgba(26,122,80,0.18); line-height: 1; min-width: 32px; }
  .title { font-size: 16px; font-weight: 700; color: var(--fg-1); margin-bottom: 4px; }
  .desc  { font-size: 13px; color: rgba(15,40,48,0.5); font-weight: 300; line-height: 1.6; }
  .header { margin-bottom: 16px; }
  .h2 { font-size: 22px; font-weight: 700; color: var(--fg-1); letter-spacing: -0.02em; }
  .line { margin-top: 6px; width: 32px; height: 3px; background: linear-gradient(90deg,#1a7a50,#2db88a); border-radius: 2px; }
</style></head>
<body>
  <div class="atmosphere"></div>
  <div class="card-pad">
    <div class="header"><div class="h2">목차</div><div class="line"></div></div>
    <div class="grid">
      <div class="item"><div class="num">01</div><div><div class="title">교육 개요 및 방향성</div><div class="desc">HCLP AX MBA 프로그램 목적과 핵심 철학</div></div></div>
      <div class="item"><div class="num">02</div><div><div class="title">AI 에이전트 실습 트랙</div><div class="desc">업무 자동화를 위한 4가지 활용법</div></div></div>
    </div>
  </div>
</body></html>
