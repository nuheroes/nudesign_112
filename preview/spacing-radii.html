<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { width: 700px; height: 200px; }
  .row { display: flex; gap: 12px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; }
  .box { width: 100%; height: 80px; background: rgba(255,255,255,0.7); border: 1px solid var(--glass-border); backdrop-filter: blur(14px); }
  .meta { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--fg-2); }
  .meta b { color: var(--fg-1); font-weight: 700; }
</style></head>
<body>
  <div class="atmosphere"></div>
  <div class="card-pad">
    <div class="row">
      <div class="item"><div class="box" style="border-radius:6px"></div><div class="meta"><b>xs</b> 6</div></div>
      <div class="item"><div class="box" style="border-radius:8px"></div><div class="meta"><b>sm</b> 8</div></div>
      <div class="item"><div class="box" style="border-radius:10px"></div><div class="meta"><b>md</b> 10</div></div>
      <div class="item"><div class="box" style="border-radius:14px"></div><div class="meta"><b>lg</b> 14</div></div>
      <div class="item"><div class="box" style="border-radius:16px"></div><div class="meta"><b>xl</b> 16</div></div>
      <div class="item"><div class="box" style="border-radius:18px"></div><div class="meta"><b>2xl</b> 18</div></div>
      <div class="item"><div class="box" style="border-radius:20px"></div><div class="meta"><b>3xl</b> 20</div></div>
      <div class="item"><div class="box" style="border-radius:28px"></div><div class="meta"><b>4xl</b> 28</div></div>
    </div>
  </div>
</body></html>
