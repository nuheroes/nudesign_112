<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Brand Colors</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { width: 700px; height: 200px; }
  .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .sw { border-radius: 14px; padding: 14px; height: 130px; display: flex; flex-direction: column; justify-content: space-between;
        border: 1px solid rgba(255,255,255,0.5); }
  .sw .name { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .sw .hex  { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500; }
  .on-dark { color: #fff; }
  .on-light { color: var(--fg-1); }
</style></head>
<body>
  <div class="atmosphere"></div>
  <div class="card-pad">
    <div class="swatches">
      <div class="sw on-dark" style="background:#0f4a30">
        <div class="name">Green 900</div><div class="hex">#0f4a30</div>
      </div>
      <div class="sw on-dark" style="background:#1a7a50">
        <div class="name">Green 700 · Primary</div><div class="hex">#1a7a50</div>
      </div>
      <div class="sw on-dark" style="background:#2db88a">
        <div class="name">Green 500 · Accent</div><div class="hex">#2db88a</div>
      </div>
      <div class="sw on-light" style="background:#8fd8b8">
        <div class="name">Green 300</div><div class="hex">#8fd8b8</div>
      </div>
      <div class="sw on-light" style="background:#c8e8d4">
        <div class="name">Green 100</div><div class="hex">#c8e8d4</div>
      </div>
    </div>
  </div>
</body></html>
