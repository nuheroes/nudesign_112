<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Eyebrows & Labels</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { width: 700px; height: 200px; }
  .row-spec { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px dashed rgba(15,40,48,0.10); }
  .row-spec:last-child { border-bottom: none; }
  .meta { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--fg-3); white-space: nowrap; }
  .label { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #1a7a50; text-transform: uppercase; }
  .tag-pill { display:inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
              background: rgba(26,122,80,0.12); color: #1a7a50; border-radius: 6px; padding: 4px 10px; }
  .badge { font-size: 11px; font-weight: 700; background: rgba(26,122,80,0.10); color: #1a7a50; border-radius: 8px; padding: 6px 14px; }
  .uppercase-light { font-size: 14px; font-weight: 300; letter-spacing: 0.10em; text-transform: uppercase; color: rgba(15,40,48,0.45); }
</style></head>
<body>
  <div class="atmosphere"></div>
  <div class="card-pad">
    <div class="row-spec"><span class="label">SECTION 01</span><div class="meta">Eyebrow · 11 / 700 / 0.14em / UPPER</div></div>
    <div class="row-spec"><span class="tag-pill">Research Agent</span><div class="meta">Tag · 10 / 700 / 0.10em</div></div>
    <div class="row-spec"><span class="badge">역량</span><div class="meta">Badge · 11 / 700 / 한글</div></div>
    <div class="row-spec"><span class="uppercase-light">Thank you</span><div class="meta">End-card · 14 / 300 / 0.10em</div></div>
  </div>
</body></html>
