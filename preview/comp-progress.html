<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Progress Bar</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { width: 700px; height: 160px; font-family: 'Pretendard','Noto Sans KR',sans-serif; }
  .stack { display:flex; flex-direction:column; gap: 18px; }
  .bar-row { position: relative; height: 12px; background: rgba(15,40,48,0.06); border-radius: 999px; }
  .bar-row .fill { position: absolute; left: 0; top: 0; bottom: 0;
                   background: linear-gradient(90deg,#1a7a50,#2db88a); border-radius: 999px; }
  .row-label { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--fg-3); margin-bottom: 6px; }
  .row-label b { color: var(--fg-1); }
  .divider { width: 100%; height: 1px; background: linear-gradient(90deg, rgba(26,122,80,0.25), transparent); }
  .accent-line { width: 36px; height: 3px; border-radius: 2px; background: linear-gradient(90deg,#1a7a50,#2db88a); }
</style></head>
<body>
  <div class="atmosphere"></div>
  <div class="card-pad">
    <div class="stack">
      <div>
        <div class="row-label"><b>Progress bar</b><span>3/6 · 50%</span></div>
        <div class="bar-row"><div class="fill" style="width:50%"></div></div>
      </div>
      <div class="divider"></div>
      <div class="accent-line"></div>
    </div>
  </div>
</body></html>
