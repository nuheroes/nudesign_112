<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Font Family</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { width: 700px; height: 200px; }
  .name { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; font-size: 64px; font-weight: 700; letter-spacing: -0.03em; color: var(--fg-1); line-height: 1; }
  .sub { margin-top: 6px; font-size: 13px; color: var(--fg-3); font-weight: 300; }
  .weights { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; align-items: baseline; }
  .w { font-size: 18px; color: var(--fg-1); }
  .w small { display: block; font-size: 10px; color: var(--fg-3); font-family: 'JetBrains Mono', monospace; margin-top: 2px; letter-spacing: 0; }
</style></head>
<body>
  <div class="atmosphere"></div>
  <div class="card-pad">
    <div class="name">Pretendard</div>
    <div class="sub">Brand sans · Korean + Latin · variable font 100–900</div>
    <div class="weights">
      <div class="w" style="font-weight:300">한솔 Hansol<small>300 Light</small></div>
      <div class="w" style="font-weight:400">한솔 Hansol<small>400 Regular</small></div>
      <div class="w" style="font-weight:500">한솔 Hansol<small>500 Medium</small></div>
      <div class="w" style="font-weight:700">한솔 Hansol<small>700 Bold</small></div>
      <div class="w" style="font-weight:900">한솔 Hansol<small>900 Black</small></div>
    </div>
  </div>
</body></html>
