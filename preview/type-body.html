<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Body Type</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { width: 700px; height: 260px; }
  .row-spec { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px dashed rgba(15,40,48,0.10); }
  .row-spec:last-child { border-bottom: none; }
  .meta { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--fg-3); white-space: nowrap; }
  .h4      { font-size: 17px; font-weight: 700; color: var(--fg-1); }
  .h5      { font-size: 15px; font-weight: 700; color: var(--fg-1); }
  .body    { font-size: 15px; font-weight: 300; color: rgba(15,40,48,0.65); line-height: 1.6; }
  .body-sm { font-size: 13px; font-weight: 300; color: rgba(15,40,48,0.65); line-height: 1.7; }
  .caption { font-size: 12px; font-weight: 300; color: rgba(15,40,48,0.50); }
</style></head>
<body>
  <div class="atmosphere"></div>
  <div class="card-pad">
    <div class="row-spec"><div class="h4">정보 수집 & 분석 에이전트</div><div class="meta">H4 · 17 / 700</div></div>
    <div class="row-spec"><div class="h5">프로그램 목적</div><div class="meta">H5 · 15 / 700</div></div>
    <div class="row-spec"><div class="body">AI 시대, 임원이 직접 경험하는 전환의 언어입니다.</div><div class="meta">Body · 15 / 300 / 1.6</div></div>
    <div class="row-spec"><div class="body-sm">시장 동향과 경쟁사 정보를 자동으로 수집합니다.</div><div class="meta">Body-sm · 13 / 300 / 1.7</div></div>
    <div class="row-spec"><div class="caption">HCLP AX MBA Track · 2025</div><div class="meta">Caption · 12 / 300</div></div>
  </div>
</body></html>
