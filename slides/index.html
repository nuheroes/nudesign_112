<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>HCLP Slide Templates</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; background: #f3f4f6; font-family: var(--font-sans); }
  .wrap { padding: 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; max-width: 1400px; margin: 0 auto; }
  .frame { background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); overflow: hidden; }
  .frame-head { padding: 14px 20px; border-bottom: 1px solid #eef0f2; font-size: 13px; font-weight: 700; color: var(--fg-1); letter-spacing: 0.04em; display: flex; justify-content: space-between; align-items: center; }
  .frame-head .meta { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--fg-3); font-weight: 400; letter-spacing: 0; }
  .frame iframe { display: block; width: 100%; aspect-ratio: 16/9; border: none; }
  h1.page { margin: 0; padding: 32px; font-size: 22px; font-weight: 700; color: var(--fg-1); letter-spacing: -0.02em; }
</style></head>
<body>
  <h1 class="page">HCLP Slide Templates · 16:9</h1>
  <div class="wrap">
    <div class="frame"><div class="frame-head">Title<span class="meta">TitleSlide.html</span></div><iframe src="TitleSlide.html"></iframe></div>
    <div class="frame"><div class="frame-head">Index<span class="meta">IndexSlide.html</span></div><iframe src="IndexSlide.html"></iframe></div>
    <div class="frame"><div class="frame-head">Content (3-up)<span class="meta">ContentSlide.html</span></div><iframe src="ContentSlide.html"></iframe></div>
    <div class="frame"><div class="frame-head">End<span class="meta">EndSlide.html</span></div><iframe src="EndSlide.html"></iframe></div>
  </div>
</body></html>
