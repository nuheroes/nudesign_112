<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>End Slide</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; }
  body { font-family: var(--font-sans); width: 1280px; height: 720px; position: relative; overflow: hidden; background: var(--bg-page); }
  .bg { position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 20% 10%, rgba(180,210,230,0.55) 0%, transparent 60%),
      radial-gradient(ellipse 60% 70% at 85% 85%, rgba(100,185,150,0.50) 0%, transparent 55%),
      linear-gradient(135deg, #dce8f0 0%, #eef5f0 45%, #c8e8d4 100%); }
  .stage { position: relative; z-index:1; height: 100%; display: flex; align-items: center; justify-content: center; }
  .card { background: rgba(255,255,255,0.72); backdrop-filter: blur(20px); border-radius: 28px; padding: 88px 130px; text-align: center; box-shadow: 0 8px 40px rgba(0,0,0,0.06); border: 1px solid rgba(255,255,255,0.9); }
  .thank { font-size: 18px; font-weight: 300; color: rgba(15,40,48,0.45); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 22px; }
  h2 { margin: 0; font-size: 50px; font-weight: 700; color: var(--fg-1); letter-spacing: -0.02em; line-height: 1.3; }
  .accent { color: #1a7a50; }
  .logo { position: absolute; bottom: 40px; left: 56px; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; color: #1a3a4a; z-index:2; }
  .logo span { color: #1a7a50; }
</style></head>
<body>
  <div class="bg"></div>
  <div class="stage">
    <div class="card">
      <div class="thank">Thank you</div>
      <h2>AI와 함께,<br><span class="accent">더 빠른 한솔</span>을 만들겠습니다.</h2>
    </div>
  </div>
  <div class="logo">:<span>Hansol</span></div>
</body></html>
